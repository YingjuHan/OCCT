name: Build (macOS/Clang)
on:
  workflow_call:

jobs:
  build-arm64:
    runs-on: macos-15
    steps:
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        path: occt.git
        fetch-depth: 1
    - name: Install Dependencies
      run: |
        brew update
        brew install \
          freetype freeimage
    - name: Configure project
      env:
        OCCT_CONFIG: |
          set(BUILD_RELEASE_DISABLE_EXCEPTIONS OFF CACHE BOOL "")
          set(BUILD_DOC_Overview OFF CACHE BOOL "")
          set(BUILD_MODULE_Draw  ON CACHE BOOL "")
          set(USE_FREETYPE       ON CACHE BOOL "")
          set(USE_FREEIMAGE      ON CACHE BOOL "")
          set(CMAKE_BUILD_TYPE "Release")
          set(INSTALL_DIR      "${CMAKE_CURRENT_LIST_DIR}/occt-install" CACHE PATH "")
      run: |
        BREW_PREFIX="$(brew --prefix)"
        echo "${OCCT_CONFIG}" | tee ./occt-make.cmake
        cmake -S ./occt.git -B ./occt-make -G Ninja --toolchain "$PWD/occt-make.cmake" \
          -D FREETYPE_DIR="$BREW_PREFIX" \
          -D FREEIMAGE_DIR="$BREW_PREFIX"
    - name: Build project
      run: |
        cmake --build ./occt-make
    - name: Install build
      run: |
        cmake --install ./occt-make --prefix ./occt-install
