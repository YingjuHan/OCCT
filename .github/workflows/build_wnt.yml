name: Build (Windows/MSVC+MinGW)
on:
  workflow_call:

jobs:
  build-mingw:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        path: occt.git
        fetch-depth: 1
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++ cmake ninja-build \
          mingw-w64-common mingw-w64-tools binutils-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix
    - name: Configure project
      env:
        # treat all warnings as error, but workaround a MinGW bug
        # src/Image/Image_PixMap.cxx:396:22: error: ‘aColorIn’ may be used uninitialized [-Werror=maybe-uninitialized]
        #    ColorToRawPixel(aRawPixelOut, myImgFormat, aColorIn, toLinearize);
        TOOLCHAIN_PREFIX: x86_64-w64-mingw32
        OCCT_CONFIG: |
          set(BUILD_RELEASE_DISABLE_EXCEPTIONS OFF CACHE BOOL "")
          set(BUILD_DOC_Overview OFF CACHE BOOL "")
          set(BUILD_MODULE_Draw  OFF CACHE BOOL "")
          set(USE_FREETYPE       OFF CACHE BOOL "")
          set(USE_FREEIMAGE      OFF CACHE BOOL "")
          set(CMAKE_SYSTEM_NAME  Windows)
          set(CMAKE_C_COMPILER   x86_64-w64-mingw32-gcc-posix)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++-posix)
          set(CMAKE_RC_COMPILER  x86_64-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_BUILD_TYPE "Release")
          set(CMAKE_C_FLAGS    "-Werror -Wno-error=maybe-uninitialized -Wno-error=array-bounds -Wno-error=deprecated-declarations")
          set(CMAKE_CXX_FLAGS  "-Werror -Wno-error=maybe-uninitialized -Wno-error=array-bounds -Wno-error=deprecated-declarations")
          set(INSTALL_DIR      "${CMAKE_CURRENT_LIST_DIR}/occt-install" CACHE PATH "")
      run: |
        ${TOOLCHAIN_PREFIX}-g++ --version
        echo "${OCCT_CONFIG}" | tee ./occt-make.cmake
        cmake -S ./occt.git -B ./occt-make -G Ninja --toolchain "$PWD/occt-make.cmake"
    - name: Build project
      run: |
        cmake --build ./occt-make
    - name: Install build
      run: |
        cmake --install ./occt-make --prefix ./occt-install

  build-msvc:
    runs-on: windows-latest
    steps:
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        path: occt.git
        fetch-depth: 1
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: x64
    - name: Generate config options
      env:
        OCCT_CONFIG: |
          set(BUILD_RELEASE_DISABLE_EXCEPTIONS OFF CACHE BOOL "")
          set(BUILD_DOC_Overview OFF CACHE BOOL "")
          set(BUILD_MODULE_Draw  OFF CACHE BOOL "")
          set(USE_FREETYPE       OFF CACHE BOOL "")
          set(USE_FREEIMAGE      OFF CACHE BOOL "")
          set(CMAKE_BUILD_TYPE "Release")
          set(CMAKE_C_FLAGS    "/WX")
          set(CMAKE_CXX_FLAGS  "/WX")
          set(INSTALL_DIR      "${CMAKE_CURRENT_LIST_DIR}/occt-install" CACHE PATH "")
      shell: bash
      run: |
        echo "${OCCT_CONFIG}" | tee ./occt-make.cmake
    - name: Configure project
      shell: cmd
      run: |
        cmake -S ./occt.git -B ./occt-make -G Ninja --toolchain "%CD%/occt-make.cmake"
    - name: Build project
      run: |
        cmake --build ./occt-make
    - name: Install build
      run: |
        cmake --install ./occt-make --prefix ./occt-install

  build-mingw-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Clone Tree
      uses: actions/checkout@v6
      with:
        path: occt.git
        fetch-depth: 1
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        msystem: UCRT64
        install: >
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-freetype
          mingw-w64-ucrt-x86_64-tcl
          mingw-w64-ucrt-x86_64-tk
    - name: Configure project
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        OCCT_CONFIG: |
          set(BUILD_RELEASE_DISABLE_EXCEPTIONS OFF CACHE BOOL "")
          set(BUILD_DOC_Overview OFF CACHE BOOL "")
          set(BUILD_MODULE_Draw  ON  CACHE BOOL "")
          set(USE_FREETYPE       ON  CACHE BOOL "")
          set(USE_FREEIMAGE      OFF CACHE BOOL "")
          set(CMAKE_BUILD_TYPE "Release")
          #set(CMAKE_C_FLAGS    "-Werror -Wno-error=maybe-uninitialized -Wno-error=array-bounds -Wno-error=deprecated-declarations")
          #set(CMAKE_CXX_FLAGS  "-Werror -Wno-error=maybe-uninitialized -Wno-error=array-bounds -Wno-error=deprecated-declarations")
          set(INSTALL_DIR      "${CMAKE_CURRENT_LIST_DIR}/occt-install" CACHE PATH "")
      run: |
        echo "${OCCT_CONFIG}" | tee ./occt-make.cmake
        cmake -S ./occt.git -B ./occt-make -G Ninja --toolchain "$PWD/occt-make.cmake" \
          -D 3RDPARTY_FREETYPE_INCLUDE_DIR_freetype2:FILEPATH="$MSYS2_LOCATION/ucrt64/include/freetype2" \
          -D 3RDPARTY_FREETYPE_INCLUDE_DIR_ft2build:FILEPATH="$MSYS2_LOCATION/ucrt64/include/freetype2" \
          -D 3RDPARTY_FREETYPE_LIBRARY_DIR:PATH="$MSYS2_LOCATION/ucrt64/lib" \
          -D 3RDPARTY_FREETYPE_LIBRARY:FILEPATH="$MSYS2_LOCATION/ucrt64/lib/libfreetype.dll.a" \
          -D 3RDPARTY_FREETYPE_DLL_DIR:PATH="$MSYS2_LOCATION/ucrt64/bin" \
          -D 3RDPARTY_FREETYPE_DLL:FILEPATH="$MSYS2_LOCATION/ucrt64/bin/libfreetype-6.dll"
    - name: Build project
      run: |
        cmake --build ./occt-make
    - name: Install project
      run: |
        cmake --install ./occt-make --prefix ./occt-install
